<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>__TITLE__</title>
<meta property="og:type" content="video.other" />
<meta property="og:title" content="__TITLE__" />
<meta property="og:description" content="__DESC__" />
<meta property="og:image" content="__BASE__/poster.jpg" />
<meta property="og:image:width" content="1920" />
<meta property="og:image:height" content="1080" />
<meta property="og:video" content="__BASE__/__VIDEO__" />
<meta property="og:video:type" content="video/mp4" />
<meta property="og:video:width" content="1920" />
<meta property="og:video:height" content="1080" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#0a0807" />
<style>
  @font-face { font-family: 'Sora'; src: url('__BASE__/sora-variable.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('__BASE__/inter-variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0a0807; color: #f5ecd9; font-family: 'Inter', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: clamp(20px, 4vw, 56px) clamp(14px, 4vw, 56px) 40px; background: radial-gradient(ellipse 80% 60% at 50% 0%, #1b1612 0%, #0a0807 70%); }
  header { width: 100%; max-width: 1600px; display: flex; align-items: center; gap: 14px; margin-bottom: clamp(18px, 3vw, 32px); }
  .studio:empty { display: none; }
  .studio { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: #ecbe5b; }
  h1 { margin: 2px 0 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: clamp(26px, 4vw, 44px); letter-spacing: -0.02em; line-height: 1.05; }
  .frame { width: 100%; max-width: 1600px; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,240,210,0.08); }
  video { width: 100%; height: 100%; display: block; background: #000; }
  p { width: 100%; max-width: 1600px; margin: 18px 0 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.55; color: #cdbfa6; }
  .fine { margin-top: 10px; font-size: 13px; color: #8b7e6d; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="studio">__BRAND__</div>
      <h1>__TITLE__</h1>
    </div>
  </header>
  <div class="frame">
    <video src="__BASE__/__VIDEO__" poster="__BASE__/poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <p>__DESC__</p>
  <p class="fine">__FINE__</p>
</body>
</html>
